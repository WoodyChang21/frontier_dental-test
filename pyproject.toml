[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safco-scraper"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.70",
    "langgraph-checkpoint-sqlite>=2.0.6",
    "openai>=1.0.0",
    "httpx>=0.27.0",
    "playwright>=1.48.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.0",
    "structlog>=24.0.0",
    "pydantic>=2.7.0",
    "pandas>=2.2.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "click>=8.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
